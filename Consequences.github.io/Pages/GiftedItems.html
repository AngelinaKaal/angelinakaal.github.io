<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consequences gifted magical items" />
    <title>Consequences - Gifted Magical Items</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../Styles.css" />
  </head>
  <body>
    <header>
      <a href="../cons-index.html">
        <img src="../Images/Items/Logo.png" alt="Consequences logo" />
      </a>
      <h1>Consequences</h1>
      <a href="../cons-index.html" class="home-button">
        <img src="../Images/Items/HouseIcon.png" alt="Home" />
      </a>
    </header>
    <main>
      <div class="gifted-items-table-container mx-4 my-5">
        <table class="gifted-items-table">
          <thead>
            <tr class="Table-Header">
              <th scope="col">Item name</th>
              <th scope="col">Description/effect</th>
            </tr>
          </thead>
          <tbody id="giftedItemsTableBody">
            <tr><td colspan="2">Loading gifted magical items...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script>
      const giftedItemsTableBody = document.getElementById("giftedItemsTableBody");
      let giftedItems = [];

      function parseGiftedItems(text) {
        return text.replace(/\r\n?/g, "\n")
          .split(/\n\s*\n/)
          .map((block) => block.split("\n").map((line) => line.trim()).filter(Boolean))
          .filter((lines) => lines.length > 0)
          .map((lines) => ({
            name: lines[0].replace(/\t+$/, ""),
            description: lines.slice(1).join(" ").trim() || "No effect listed."
          }));
      }

      function renderGiftedItems() {
        const rows = document.createDocumentFragment();
        for (const item of giftedItems) {
          const row = document.createElement("tr");
          const nameCell = document.createElement("th");
          nameCell.scope = "row";
          nameCell.textContent = item.name;

          const descriptionCell = document.createElement("td");
          descriptionCell.textContent = item.description;

          row.append(nameCell, descriptionCell);
          rows.append(row);
        }
        giftedItemsTableBody.replaceChildren(rows);
      }

      fetch("../GiftedItems.txt")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Could not load gifted items (${response.status}).`);
          }
          return response.text();
        })
        .then((text) => {
          giftedItems = parseGiftedItems(text);
          renderGiftedItems();
        })
        .catch((error) => {
          console.error("Failed to load gifted items.", error);
          const errorRow = document.createElement("tr");
          const errorCell = document.createElement("td");
          errorCell.colSpan = 2;
          errorCell.textContent = "Gifted magical items could not be loaded.";
          errorRow.append(errorCell);
          giftedItemsTableBody.replaceChildren(errorRow);
        });
    </script>
  </body>
</html>
