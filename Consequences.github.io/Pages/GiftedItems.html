<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consequences gifted magical items" />
    <title>Consequences - Gifted Magical Items</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../Styles.css" />
  </head>
  <body class="gifted-items-page">
    <header>
      <a href="../cons-index.html">
        <img src="../Images/Items/Logo.png" alt="Consequences logo" />
      </a>
      <h1>Consequences</h1>
      <a href="../cons-index.html" class="home-button">
        <img src="../Images/Items/HouseIcon.png" alt="Home" />
      </a>
    </header>
    <main class="gifted-items-main">
      <div id="giftedItemsTables">
        <p>Loading gifted magical items...</p>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script>
      const giftedItemsTables = document.getElementById("giftedItemsTables");
      const giftedItemCategories = ["Magic Weapons", "Magic Armour", "Magical Utility Items"];

      function parseGiftedItems(text) {
        const categories = giftedItemCategories.map((name) => ({ name, items: [] }));
        const categoryByName = new Map(categories.map((category) => [category.name, category]));
        let currentCategory = null;
        const blocks = text.replace(/\r\n?/g, "\n")
          .split(/\n\s*\n/)
          .map((block) => block.split("\n").map((line) => line.trim()).filter(Boolean))
          .filter((lines) => lines.length > 0);

        for (const lines of blocks) {
          let itemLines = lines;
          if (categoryByName.has(lines[0])) {
            currentCategory = categoryByName.get(lines[0]);
            itemLines = lines.slice(1);
          }
          if (itemLines.length === 0) {
            continue;
          }
          if (!currentCategory) {
            throw new Error(`Gifted item found before a category heading: ${itemLines[0]}.`);
          }
          currentCategory.items.push({
            name: itemLines[0],
            description: itemLines.slice(1).join(" ").trim() || "No effect listed."
          });
        }

        return categories;
      }

      function renderGiftedItems(categories) {
        const tables = document.createDocumentFragment();
        for (const category of categories) {
          const heading = document.createElement("h2");
          heading.textContent = category.name;

          const tableContainer = document.createElement("div");
          tableContainer.className = "gifted-items-table-container mb-5";
          const table = document.createElement("table");
          table.className = "gifted-items-table";

          const tableHead = document.createElement("thead");
          const headerRow = document.createElement("tr");
          headerRow.className = "Table-Header";
          for (const headerText of ["Item name", "Description/effect"]) {
            const header = document.createElement("th");
            header.scope = "col";
            header.textContent = headerText;
            headerRow.append(header);
          }
          tableHead.append(headerRow);

          const tableBody = document.createElement("tbody");
          for (const item of category.items) {
            const row = document.createElement("tr");
            const nameCell = document.createElement("th");
            nameCell.scope = "row";
            nameCell.dataset.label = "Item";
            nameCell.textContent = item.name;

            const descriptionCell = document.createElement("td");
            descriptionCell.dataset.label = "Effect";
            descriptionCell.textContent = item.description;

            row.append(nameCell, descriptionCell);
            tableBody.append(row);
          }

          table.append(tableHead, tableBody);
          tableContainer.append(table);
          tables.append(heading, tableContainer);
        }
        giftedItemsTables.replaceChildren(tables);
      }

      fetch("../GiftedItems.txt")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Could not load gifted items (${response.status}).`);
          }
          return response.text();
        })
        .then((text) => {
          renderGiftedItems(parseGiftedItems(text));
        })
        .catch((error) => {
          console.error("Failed to load gifted items.", error);
          const errorMessage = document.createElement("p");
          errorMessage.textContent = "Gifted magical items could not be loaded.";
          giftedItemsTables.replaceChildren(errorMessage);
        });
    </script>
  </body>
</html>
