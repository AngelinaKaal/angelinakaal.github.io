<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consequences gifted magical items" />
    <title>Consequences - Gifted Magical Items</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../Styles.css" />
  </head>
  <body>
    <header>
      <a href="../cons-index.html">
        <img src="../Images/Items/Logo.png" alt="Consequences logo" />
      </a>
      <h1>Consequences</h1>
      <a href="../cons-index.html" class="home-button">
        <img src="../Images/Items/HouseIcon.png" alt="Home" />
      </a>
    </header>
    <main class="selection-page">
      <div class="selection-layout">
        <div class="selection-controls">
          <label class="selection-select-label" for="giftedItemSelect">Choose a gifted magical item</label>
          <select id="giftedItemSelect" class="form-select selection-select" aria-label="Choose a gifted magical item" disabled>
            <option value="" selected disabled>Select a gifted magical item</option>
          </select>
        </div>
        <div id="giftedItemDetails" class="selection-details text-start" aria-live="polite">
          Select a gifted magical item to see its effect.
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script>
      const itemSelect = document.getElementById("giftedItemSelect");
      const itemDetails = document.getElementById("giftedItemDetails");
      let giftedItems = [];

      function parseGiftedItems(text) {
        return text.replace(/\r\n?/g, "\n")
          .split(/\n\s*\n/)
          .map((block) => block.split("\n").map((line) => line.trim()).filter(Boolean))
          .filter((lines) => lines.length > 0)
          .map((lines) => ({
            name: lines[0].replace(/\t+$/, ""),
            description: lines.slice(1).join(" ").trim() || "No effect listed."
          }));
      }

      function showGiftedItem(name) {
        const item = giftedItems.find((entry) => entry.name === name);
        if (!item) {
          itemDetails.textContent = `No description found for ${name}.`;
          return;
        }

        const heading = document.createElement("h2");
        heading.className = "content-section-heading";
        heading.textContent = item.name;

        const description = document.createElement("div");
        description.className = "content-section";
        description.textContent = item.description;

        itemDetails.replaceChildren(heading, description);
      }

      itemSelect.addEventListener("change", () => showGiftedItem(itemSelect.value));

      fetch("../GiftedItems.txt")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Could not load gifted items (${response.status}).`);
          }
          return response.text();
        })
        .then((text) => {
          giftedItems = parseGiftedItems(text);
          const options = document.createDocumentFragment();

          for (const item of giftedItems) {
            const option = document.createElement("option");
            option.value = item.name;
            option.textContent = item.name;
            options.append(option);
          }

          itemSelect.replaceChildren(
            Object.assign(document.createElement("option"), {
              value: "",
              textContent: "Select a gifted magical item",
              disabled: true,
              selected: true
            }),
            options
          );
          itemSelect.disabled = false;
        })
        .catch((error) => {
          console.error("Failed to load gifted items.", error);
          itemDetails.textContent = "Gifted magical items could not be loaded.";
        });
    </script>
  </body>
</html>
