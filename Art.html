<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Art | Portfolio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link rel="stylesheet" href="Variables.css">
	<link rel="stylesheet" href="index.css">
</head>

<body class="PowerBIBody art-page">
	<div class="topnav">
		<h1 class="float-left">Portfolio - Angelina Kaal</h1>
		<a href="index.html" aria-label="Home">
			<i class="bi bi-house-fill" aria-hidden="true"></i>
		</a>
		<button class="topnav-toggle" type="button" aria-expanded="false" aria-controls="topnav-links">
			<i class="bi bi-list" aria-hidden="true"></i>
			<span class="visually-hidden">Open navigation</span>
		</button>
		<nav id="topnav-links" class="topnav-links" aria-label="Primary navigation">
			<a href="PowerBI.html" data-en="Power BI" data-nl="Power BI">Power BI</a>
			<a href="Unity.html" data-en="Unity" data-nl="Unity">Unity</a>
			<a href="HTML.html" data-en="HTML" data-nl="HTML">HTML</a>
			<a href="Art.html" data-en="Art" data-nl="Kunst">Art</a>
		</nav>
		<div class="language-switch" role="group" aria-label="Language selection">
			<button type="button" data-language="nl" aria-pressed="false">NL</button>
			<button type="button" data-language="en" aria-pressed="true">EN</button>
		</div>
	</div>

	<main class="main art-main flex-grow-1">
		<section class="art-gallery" aria-labelledby="art-heading">
			<div class="art-toolbar">
				<h2 id="art-heading">Art</h2>
				<label for="art-filter">Filter <span class="visually-hidden">artwork</span></label>
				<input id="art-filter" type="search" placeholder="all/neurophase/jesse jester/other" autocomplete="off">
			</div>
			<div id="art-grid" class="art-grid" aria-live="polite"></div>
			<p id="art-empty" class="art-empty" hidden>No artwork matches this filter.</p>
		</section>
	</main>

	<div id="art-modal" class="art-modal" hidden>
		<div class="art-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="art-modal-title">
			<button id="art-modal-close" class="art-modal-close" type="button" aria-label="Close artwork details">
				<i class="bi bi-x-lg" aria-hidden="true"></i>
			</button>
			<div class="art-modal-image-wrap">
				<img id="art-modal-image" src="" alt="" draggable="false">
			</div>
			<div class="art-modal-tools" aria-label="Image controls">
				<label for="art-zoom">Zoom</label>
				<input id="art-zoom" type="range" min="1" max="3" step="0.05" value="1">
				<span id="art-zoom-value">100%</span>
				<button id="art-zoom-reset" type="button">Reset</button>
			</div>
			<div class="art-modal-details">
				<h2 id="art-modal-title"></h2>
				<dl class="art-modal-meta">
					<div><dt data-en="Artist" data-nl="Kunstenaar">Artist</dt><dd id="art-modal-artist"></dd></div>
					<div><dt data-en="Collection" data-nl="Collectie">Collection</dt><dd id="art-modal-collection"></dd></div>
					<div><dt data-en="Date drawn" data-nl="Datum getekend">Date drawn</dt><dd id="art-modal-date"></dd></div>
					<div><dt data-en="Time spent" data-nl="Tijd besteed">Time spent</dt><dd id="art-modal-time"></dd></div>
				</dl>
				<div class="art-modal-description">
					<h3 data-en="Image description" data-nl="Beschrijving van de afbeelding">Image description</h3>
					<p id="art-modal-description"></p>
				</div>
			</div>
		</div>
	</div>
	<script src="Images/art/art-data.js"></script>
	<script src="script.js"></script>
</body>

</html>
