<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Variables.css">
    <link rel="stylesheet" href="index.css">
</head>

<body class="PowerBIBody">
    <!-- Top Navigation -->
    <div class="topnav">
        <h1 class="float-left">Portfolio - Angelina Kaal</h1>
        <a href="index.html" aria-label="Home">
            <i class="bi bi-house-fill" aria-hidden="true"></i>
        </a>
        <button class="topnav-toggle" type="button" aria-expanded="false" aria-controls="topnav-links">
            <i class="bi bi-list" aria-hidden="true"></i>
            <span class="visually-hidden">Open navigation</span>
        </button>
        <nav id="topnav-links" class="topnav-links" aria-label="Primary navigation">
            <a href="#news">Art</a>
            <a href="#contact">HTML</a>
            <a href="#about">Unity</a>
            <a href="PowerBI.html">Power BI</a>
        </nav>
    </div>
    <!-- Main Content -->
    <div class="container project-list">
        <button class="btn btn-BI" type="button" data-project="art-sales" aria-pressed="true">Art Sales</button>
        <button class="btn btn-BI" type="button" data-project="CBS" aria-pressed="false">CBS</button>
        <button class="btn btn-BI" type="button" data-project="finals-duo" aria-pressed="false">Finals - DUO</button>
        <button class="btn btn-BI" type="button" data-project="monthly-report" aria-pressed="false">Monthly Report</button>
        <h3>The projects listed here are fictional, they were made as assignments for my traineeship at DAATlab.</h3>
    </div>

    <main class="container project-showcase" aria-live="polite">
        <section class="project-description" aria-labelledby="project-title">
            <p class="project-eyebrow">Selected project</p>
            <h1 id="project-title">Art Sales</h1>
            <p id="project-text"></p>
        </section>

        <section class="project-carousel" aria-label="Project screenshots">
            <div class="carousel-frame">
                <img id="project-image" src="Images/ArtImage.png" alt="Art Sales project preview">
                <button id="open-fullscreen" class="carousel-arrow image-fullscreen-button" type="button"
                    aria-label="Open image fullscreen">
                    <i class="bi bi-arrows-fullscreen" aria-hidden="true"></i>
                </button>
            </div>
            <div class="carousel-controls">
                <button id="previous-image" class="carousel-arrow" type="button" aria-label="Previous project image">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                </button>
                <span id="image-counter" aria-live="polite">1 / 4</span>
                <button id="next-image" class="carousel-arrow" type="button" aria-label="Next project image">
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>
            </div>
        </section>
    </main>

    <div id="image-modal" class="image-modal" role="dialog" aria-modal="true" aria-labelledby="fullscreen-title" hidden>
        <div class="fullscreen-viewer">
            <div class="fullscreen-header">
                <h2 id="fullscreen-title">Project image</h2>
                <button id="close-fullscreen" class="carousel-arrow" type="button" aria-label="Close fullscreen image">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </div>
            <div class="fullscreen-content">
                <button id="fullscreen-previous" class="carousel-arrow" type="button" aria-label="Previous project image">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                </button>
                <img id="fullscreen-image" src="Images/ArtImage.png" alt="Art Sales project preview">
                <button id="fullscreen-next" class="carousel-arrow" type="button" aria-label="Next project image">
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>
            </div>
            <span id="fullscreen-counter" class="fullscreen-counter" aria-live="polite">1 / 4</span>
        </div>
    </div>

        <!-- Social Media Links -->
    <div class="bottomnav align-items-center d-flex justify-content-center py-3">
        <a class="px-5" href="https://www.linkedin.com/in/angelina-r-kaal/" target="_blank"
            rel="noopener noreferrer">LinkedIn</a>
        <a class="px-5" href="https://github.com/AngelinaKaal" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span class="copy-contact px-5" role="button" tabindex="0"
            data-copy-value="angelina.r.kaal@gmail.com">Email</span>
        <span class="copy-contact px-5" role="button" tabindex="0" data-copy-value="+31 6 29876217">Phone</span>
        <a class="px-5" href="https://gamejolt.com/@JamesWitch/games" target="_blank" rel="noopener noreferrer">GameJolt</a>
    </div>

    <div id="copyNotice" class="copy-notice" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
</body>

</html>
